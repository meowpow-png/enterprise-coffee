buildscript {
    // needed so flyway can connect to postgres database
    dependencies {
        classpath "org.postgresql:postgresql:42.7.11"
        classpath 'org.flywaydb:flyway-database-postgresql:12.8.1'
    }
}
plugins {
    id 'java'
    id 'co.uzzu.dotenv.gradle' version '4.0.0'
    id 'org.springframework.boot' version '4.0.6'
    id "io.spring.dependency-management" version '1.1.7'
    id 'org.flywaydb.flyway' version '12.8.1'
    id 'com.senthora.gatlingfx' version '0.1.0-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

flyway {
    url = "jdbc:postgresql://localhost:5432/${env.DB_NAME.value}"
    user = env.DB_USER.value
    password = env.DB_PASSWORD.value
    cleanDisabled = false
}

gatlingfx {
    sourceSets = ['integrationTest']
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql:12.8.1'
    runtimeOnly 'org.postgresql:postgresql:42.7.11'
}

testing {
    suites {
        integrationTest(JvmTestSuite) {
            dependencies {
                implementation 'org.springframework.boot:spring-boot-starter-test'
            }
            useJUnitJupiter()
        }
    }
}
